name: devinsight
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: devinsight
      MYSQL_USER: ${DB_USERNAME:-devinsight}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devinsight?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-devinsight}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_GITHUB_LOGIN: ${ADMIN_GITHUB_LOGIN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/data/uploads
      INTERVIEW_PER_HOUR: ${INTERVIEW_PER_HOUR:-12}
      AI_CALLS_PER_DAY: ${AI_CALLS_PER_DAY:-150}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    profiles: ["app"]
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  mysql-data:
  uploads:
