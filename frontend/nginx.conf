server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ~ ^/(api|oauth2|login|actuator)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
