name: Build and verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: devinsight_test
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-ephemeral"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: backend
      - run: ./gradlew test --rerun-tasks --no-daemon
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://localhost:3306/devinsight_test?serverTimezone=UTC
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-ephemeral
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
