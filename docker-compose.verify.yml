# Used only by scripts/verify-compose.ps1; overrides host ports and disables external AI/OAuth.
services:
  mysql:
    ports: !override ["127.0.0.1:33071:3306"]
  backend:
    ports: !override ["127.0.0.1:18081:8080"]
    environment:
      OPENAI_API_KEY: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      ADMIN_GITHUB_LOGIN: ''
      GITHUB_TOKEN: ''
      COOKIE_SECURE: 'false'
  frontend:
    ports: !override ["127.0.0.1:15173:80"]
